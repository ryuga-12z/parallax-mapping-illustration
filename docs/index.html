<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>イラスト立体視シミュレーター — Web Demo</title>
<style>
  /* ── 淡いグラデーション背景 + ガラスモーフィズム UI ── */
  :root {
    --sand:    #fef6ec;
    --coral:   #ff8c69;
    --aqua:    #6fd1c7;
    --sea:     #3a9ea5;
    --ink:     #37474f;
    --glass:   rgba(255, 255, 255, 0.45);
    --glass-line: rgba(255, 255, 255, 0.65);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: "Helvetica Neue", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: var(--ink);
    /* 淡いグラデーション背景 */
    background:
      radial-gradient(120% 90% at 15% 0%, #fff3e0 0%, rgba(255,243,224,0) 55%),
      radial-gradient(120% 120% at 90% 100%, #bdeee8 0%, rgba(189,238,232,0) 50%),
      linear-gradient(160deg, #ffe7d1 0%, #ffd9c2 22%, #a9e3dd 70%, #7fcbd0 100%);
  }

  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* 左上のタイトルカード（ガラスモーフィズム） */
  .brand {
    position: fixed;
    top: 24px;
    left: 24px;
    padding: 16px 22px;
    border-radius: 20px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 8px 32px rgba(58, 158, 165, 0.18);
    pointer-events: none;
    max-width: min(320px, 60vw);
  }
  .brand h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 0.06em;
  }
  .brand .dot { color: var(--coral); }
  .brand p {
    margin: 6px 0 0;
    font-size: 12px;
    line-height: 1.6;
    opacity: 0.72;
  }

  /* 下部のヒント */
  .hint {
    position: fixed;
    bottom: 20px;
    left: 24px;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--glass);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 11.5px;
    opacity: 0.8;
    pointer-events: none;
  }

  /* 一時トースト（画面下中央、一定時間後にフェードアウト）*/
  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translate(-50%, 8px);
    padding: 11px 20px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(14px) saturate(1.3);
    -webkit-backdrop-filter: blur(14px) saturate(1.3);
    box-shadow: 0 8px 28px rgba(58, 158, 165, 0.22);
    font-size: 12.5px;
    color: var(--ink);
    letter-spacing: 0.02em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease, transform 0.28s ease;
    z-index: 10;
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  .toast .icon {
    color: var(--coral);
    margin-right: 6px;
    font-weight: 500;
  }

  /* ── lil-gui の CSS トークン上書きでテーマ配色に統一 ── */
  .lil-gui {
    --background-color: rgba(255, 255, 255, 0.42);
    --title-background-color: rgba(255, 255, 255, 0.55);
    --title-text-color: #2f6f74;
    --text-color: #3a5257;
    --widget-color: rgba(111, 209, 199, 0.28);
    --hover-color: rgba(111, 209, 199, 0.45);
    --focus-color: rgba(255, 140, 105, 0.55);
    --number-color: #e0765a;
    --string-color: #3a9ea5;
    --slider-knob-color: #ff8c69;
    --slider-input-color: var(--sea);
    --slider-input-focus-color: var(--coral);
    --font-size: 12px;
    --input-font-size: 12px;
    --widget-height: 22px;
    --padding: 9px;
    --spacing: 6px;
    --border-radius: 12px;
    --font-family: inherit;

    top: 24px;
    right: 24px;
    /* ガラスモーフィズム */
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--glass-line);
    backdrop-filter: blur(16px) saturate(1.4);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    box-shadow: 0 10px 36px rgba(58, 158, 165, 0.22);
  }
  .lil-gui.root > .title {
    font-weight: 400;
    letter-spacing: 0.08em;
  }
  .lil-gui .title { border: none; }

  /* ── iOS ジャイロ権限オーバーレイ ── */
  /* モバイルかつ requestPermission 実装ありのときだけ JS が hidden を外す。 */
  .gyro-overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    z-index: 20;
    background: rgba(58, 158, 165, 0.28);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  /* class + 属性でUAの [hidden]{display:none} より確実に勝たせる。 */
  .gyro-overlay[hidden] { display: none; }
  .gyro-card {
    max-width: 320px;
    text-align: center;
    padding: 24px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid var(--glass-line);
    box-shadow: 0 10px 36px rgba(58, 158, 165, 0.28);
  }
  .gyro-msg {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
  }
  .gyro-btn {
    appearance: none;
    -webkit-appearance: none;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    min-height: 44px;
    font-size: 15px;
    font-family: inherit;
    color: #fff;
    background: var(--coral);
    box-shadow: 0 6px 18px rgba(255, 140, 105, 0.4);
    cursor: pointer;
  }

  /* ── モバイルモード（body.mobile）専用分岐。@media は使わず class で統一 ── */
  /* 端末負荷対策で blur を軽減（14〜16px → 6px）。GPU 合成の負担がでかいから。 */
  body.mobile .brand,
  body.mobile .toast {
    backdrop-filter: blur(6px) saturate(1.3);
    -webkit-backdrop-filter: blur(6px) saturate(1.3);
  }
  body.mobile .lil-gui {
    backdrop-filter: blur(6px) saturate(1.4);
    -webkit-backdrop-filter: blur(6px) saturate(1.4);
    /* 指で押せるようタッチターゲットを拡大。計画の「44×44px 以上」に合わせてる（PLAN_MOBILE.md:49）。 */
    --widget-height: 44px;
    /* 44px ハンドルとの視覚バランスで文字と余白も一段上げる。 */
    --font-size: 15px;
    --input-font-size: 15px;
    --padding: 15px;
    --spacing: 12px;
  }

  /* タイトルカードは上部センターへ。段落は畳んでタイトルだけ残す（HTMLはいじらない）。 */
  body.mobile .brand {
    left: 50%;
    right: auto;
    top: 12px;
    transform: translateX(-50%);
    max-width: calc(100vw - 24px);
  }
  body.mobile .brand p { display: none; }

  /* ヒントはマウス/スクロール前提の文言なのでモバイルでは隠す。 */
  body.mobile .hint { display: none; }

  /* トーストは折りたたみ時のドロワー(44px)と被らない高さへ上げる。 */
  body.mobile .toast { bottom: 90px; }

  /* lil-gui を下部ドロワー化。 */
  body.mobile .lil-gui.root {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: auto;
    width: 100%;
    border-radius: 20px 20px 0 0;
    /* 折りたたみ状態：ハンドル(44px)だけ残して画面外へ落とす。 */
    transform: translateY(calc(100% - 44px));
    transition: transform 0.28s ease;
  }
  body.mobile .lil-gui.root.drawer-open {
    transform: translateY(0);
  }
  /* 展開時に画面を越えないよう中身をスクロールさせる。 */
  body.mobile .lil-gui.root > .children {
    max-height: 60vh;
    overflow-y: auto;
  }
  /* ルートタイトルをドラッグハンドル化。高さ44px、中央に「―」バーを疑似要素で。 */
  body.mobile .lil-gui.root > .title {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  body.mobile .lil-gui.root > .title::before {
    content: "";
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: rgba(47, 111, 116, 0.4);
  }

  /* UI 表示切替の丸ボタン。右上固定でドロワー(z-index相当)より手前に置く。 */
  /* .brand と同トーンのガラスモーフィズムで馴染ませる。UI を隠しても戻せるようこれだけは残す前提。 */
  body.mobile #ui-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--glass-line);
    background: var(--glass);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 25px;
    line-height: 44px;
    padding: 0;
    cursor: pointer;
    z-index: 20;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="brand">
    <h1>イラスト立体視シミュレーター<span class="dot">.</span></h1>
    <p>視差マッピング+ホログラムシール表現を利用したシミュレーターです。右のパネルで操作できます。
      <br>イラストは透過で分けたものを読み込んでください。
      <br>最大4枚まで対応</p>
  </div>
  <div class="hint">マウスを動かすと傾く / drag で移動 / scroll でズーム / スペースキーでUIを切り替え / パネルから画像を読み込み</div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- モバイル用 UI 表示切替ボタン（PC 版 Space キー相当）。既定は非表示、モバイル時のみ JS が hidden を外す。 -->
  <button id="ui-toggle" class="ui-toggle" type="button" aria-label="UI表示切替" aria-pressed="true" hidden>◐</button>

  <!-- iOS 用ジャイロ権限オーバーレイ（既定は非表示。モバイル＆requestPermission実装時のみJSが表示）-->
  <div id="gyro-overlay" class="gyro-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="gyro-overlay-title">
    <div class="gyro-card">
      <p id="gyro-overlay-title" class="gyro-msg">端末を傾けてイラストを動かすには、モーションセンサーの許可が必要です。</p>
      <button id="gyro-enable" class="gyro-btn" type="button">ジャイロを有効にする</button>
    </div>
  </div>

  <!-- three.js と lil-gui を CDN から ESM 形式で読み込み -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
